name: htownsim

services:
  incident-service:
    build:
      context: ../IncidentService
      dockerfile: Dockerfile
    environment:
      # Listen on every interface so the city server container can reach it; it is not published to the host.
      Urls: "http://0.0.0.0:5870"
      Service__LedgerPath: "/data/ledger.json"
    volumes:
      - incident-ledger:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5870 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  city-server:
    build:
      context: ../../Builds/CityServer
      dockerfile: ../../Tools/CityServer/Dockerfile
    depends_on:
      incident-service:
        condition: service_healthy
    environment:
      HTOWNSIM_BIND_ALL: "1"
      HTOWNSIM_INCIDENT_SERVICE: "http://incident-service:5870"
    healthcheck:
      # Healthy once the readiness listener on 7777 sends its ready line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7777 && read -t 3 line <&3 && [ \"$$line\" = \"HTOWNSIM READY 1\" ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      - "127.0.0.1:7777:7777"
      - "127.0.0.1:7778:7778"

volumes:
  incident-ledger:
