name: htownsim

services:
  city-server:
    build:
      context: ../../Builds/CityServer
      dockerfile: ../../Tools/CityServer/Dockerfile
    environment:
      HTOWNSIM_BIND_ALL: "1"
    healthcheck:
      # Healthy once the readiness listener on 7777 sends its ready line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7777 && read -t 3 line <&3 && [ \"$$line\" = \"HTOWNSIM READY 1\" ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      - "127.0.0.1:7777:7777"
      - "127.0.0.1:7778:7778"
